name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true

  zip:
    name: Zip HACS
    needs: release
    uses: ./.github/workflows/release-zip.yaml
    with:
      tag: ${{ github.ref_name }}
