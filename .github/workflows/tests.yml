name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Pytest, mypy, ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Dépendances
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check custom_components tests
      - name: Mypy (strict)
        run: mypy custom_components/saintdujour
      - name: Pytest + couverture (seuil 95 %)
        run: >-
          pytest -p no:logging
          --cov=custom_components/saintdujour
          --cov-report=term-missing
          --cov-fail-under=95
