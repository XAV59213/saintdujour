name: Rename brand assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Convert and rename brand files
        run: |
          set -euo pipefail
          BRAND=custom_components/saintdujour/brand
          cd "$BRAND"

          if [ -f IMG_7243.jpeg ]; then
            convert IMG_7243.jpeg -strip PNG32:icon.png
            convert IMG_7243.jpeg -strip -resize 512x512! PNG32:icon@2x.png
            cp icon.png dark_icon.png
            cp icon@2x.png dark_icon@2x.png
            rm -f IMG_7243.jpeg
          fi

          if [ -f IMG_7244.jpeg ]; then
            convert IMG_7244.jpeg -strip PNG32:logo.png
            convert IMG_7244.jpeg -strip -resize 910x512! PNG32:logo@2x.png
            rm -f IMG_7244.jpeg
          fi

          rm -f .keep _test.png

          echo "Result:"
          ls -la
          identify icon.png logo.png icon@2x.png logo@2x.png || true

      - name: Commit renamed assets
        run: |
          git config user.name "XAV59213"
          git config user.email "153436936+XAV59213@users.noreply.github.com"
          git add -A custom_components/saintdujour/brand
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(brand): rename IMG_7243/7244 en icon.png et logo.png"
          git push
